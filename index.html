<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Hololive EN Gen 3 Justice Fanpage</title>

        <script src="js/jquery-1.11.1.js"></script>
        <script src="js/agregados.js"></script>

		<style>
            * {
                margin: 0;
                padding: 0;
            }

            nav {
                width: 100%;
                background-color: #F5FBFF;
                position: fixed;
                text-align : right;
            }

            nav url {
                list-style: none;
            }

            nav ul li {
                display: inline-block;
                padding-top: 15px;
                padding-right: 10px;
                transition: all 1s;
            }

            nav ul li:hover{
                opacity : 0.75;
                transform: scale(110%);
            }

            #Elizabeth {
                width: 100%;
                height: 1000px;
                background-image: url("recursos/ElizabethRoseBloodflame.png");
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-position: center;
                background-color: #D47474;
            }

            #Cecilia {
                width: 100%;
                height: 1000px;
                background-image: url("recursos/CeciliaImmergreen.png");
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-position: center;
                background-color: #74D47D;
            }

            #Raora {
                width: 100%;
                height: 1000px;
                background-image: url("recursos/RaoraPanthera.png");
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-position: center;
                background-color: #D474CB;
            }

            #Gigi {
                width: 100%;
                height: 1000px;
                background-image: url("recursos/GigiMurin.png");
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-position: center;
                background-color: #D4AC74;
            }
		</style>

	</head>
	<body>
		<div id="container">
			<nav>
                <ul>
                    <li><a href="#Elizabeth"><img src="recursos/ElizabethRoseBloodflame.png" width="55px"></a></li>
                    <li><a href="#Cecilia"><img src="recursos/CeciliaImmergreen.png" width="55px"></a></li>
                    <li><a href="#Raora"><img src="recursos/RaoraPanthera.png" width="55px"></a></li>
                    <li><a href="#Gigi"><img src="recursos/GigiMurin.png" width="55px"></a></li>
                </ul>
			</nav>

			<div id="Elizabeth">

			</div>

			<div id="Cecilia">

			</div>

			<div id="Raora">

			</div>

            <div id="Gigi">

            </div>
		</div>
	</body>
</html>
